<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DJ Sorter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="kit.css">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
  /* Только раскладка страницы. Все элементы — из kit.css (см. kit.html). */
  body{min-height:100%}
  /* шар: canvas не ресайзится, едет и сжимается только transform (GPU) */
  #orb{position:fixed;inset:0;z-index:0;transform-origin:50% 50%;will-change:transform;transform:translate3d(0,-6vh,0);transition:transform var(--t-orb) var(--ease-io)}   /* поднят на 6vh, чтобы заголовок и кнопка меньше на него заезжали */
  #orb canvas{display:block;width:100%;height:100%}
  body.logo #orb{transform:translate3d(0,calc(100px + env(safe-area-inset-top,0px) - 50vh),0) scale(var(--orb-s,.18));pointer-events:none}

  #hero{position:fixed;inset:auto 0 calc(7vh + env(safe-area-inset-bottom,0px)) 0;z-index:2;gap:var(--sp-5)}
  #prog{position:fixed;left:0;right:0;margin-inline:auto;bottom:calc(7vh + env(safe-area-inset-bottom,0px));width:min(520px,calc(100vw - 32px));z-index:2}
  #prog .now{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-3)}
  #prog .now b{display:inline-flex;align-items:center;gap:10px;font-size:16px}
  #steps{justify-content:center;margin-top:var(--sp-4);gap:var(--sp-2)}
  #pNote{min-height:1.4em;margin-top:var(--sp-2);text-align:center}

  #lib{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:calc(200px + env(safe-area-inset-top,0px)) var(--sp-4) var(--sp-7)}
  .libhead{display:flex;flex-wrap:wrap;gap:var(--sp-4);align-items:flex-end;justify-content:space-between;margin-bottom:var(--sp-4)}
  #sorts{margin-bottom:var(--sp-4)}
  #more{display:flex;margin:var(--sp-5) auto 0}
</style>
</head>
<body>
  <div id="orb" aria-hidden="true"></div>

  <header class="topbar a-wait" id="top">
    <div class="brand-wrap"><span class="brand">dj<b>/</b>sorter</span><span class="version" id="ver"></span></div>
    <nav><a class="btn btn--tertiary btn--sm" href="nerd_mode.html">nerd_mode</a><button class="btn btn--secondary btn--sm" id="logout" hidden>Выйти</button></nav>
  </header>

  <section id="hero" class="center">
    <h1 class="t-display a-wait" id="heroTitle">feed me</h1>
    <button id="feed" class="btn btn--primary btn--lg a-wait" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0a12 12 0 1 0 0 24 12 12 0 0 0 0-24zm5.5 17.3a.75.75 0 0 1-1 .25c-2.8-1.7-6.3-2.1-10.4-1.2a.75.75 0 1 1-.33-1.46c4.5-1 8.4-.6 11.5 1.4.35.2.46.66.24 1.01zm1.47-3.27a.94.94 0 0 1-1.29.31c-3.2-1.97-8.1-2.54-11.9-1.39a.94.94 0 0 1-.54-1.8c4.3-1.3 9.7-.67 13.4 1.6.44.27.58.85.31 1.28zm.13-3.4C15.26 8.35 8.9 8.14 5.2 9.26a1.12 1.12 0 1 1-.65-2.15c4.24-1.29 11.3-1.04 15.7 1.6a1.12 1.12 0 0 1-1.15 1.93z"/></svg>Войти через Spotify</button>
    <div id="heroErr" class="t-err" hidden></div>
  </section>

  <section id="prog" hidden aria-live="polite">
    <div class="now"><b><span class="eq" id="pEq"><i></i><i></i><i></i><i></i></span><span id="pLabel">…</span></b><span class="t-sub t-sm num" id="pCnt"></span></div>
    <div class="progress is-accent"><i id="pBar"></i></div>
    <div id="steps" class="row"></div>
    <div class="t-sub t-sm" id="pNote"></div>
  </section>

  <main id="lib" hidden>
    <div class="libhead">
      <div>
        <div class="t-eyebrow">Лайки Spotify</div>
        <h2 class="t-h1">Твоя библиотека</h2>
        <div class="t-sub t-sm" id="libStat"></div>
      </div>
      <label class="field"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg><input id="q" type="search" placeholder="Трек, артист, 124, 8A…" autocomplete="off"></label>
    </div>
    <div id="sorts" class="row row--scroll"></div>
    <div class="tracks-scroll"><table class="tracks">
      <thead><tr>
        <th data-k="n" class="c-n hide-s">#</th>
        <th data-k="name">Название</th>
        <th data-k="bpm">BPM</th>
        <th data-k="key">Key</th>
        <th data-k="energy" class="hide-s">Energy</th>
        <th data-k="added" class="hide-s">Добавлено</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <button class="btn btn--secondary btn--sm" id="more" hidden>Показать ещё</button>
  </main>

<script>
// код версии = короткий хэш коммита, который сейчас задеплоен на GitHub Pages (публичный API, без ключей)
(async () => {
  const el = document.getElementById('ver'), KEY = 'ver.sha';
  try { const c = JSON.parse(sessionStorage.getItem(KEY) || 'null'); if (c && Date.now() - c.t < 3e5) { el.textContent = c.sha; return; } } catch {}
  try {
    const r = await fetch('https://api.github.com/repos/randomasan/dj-sorter/deployments?environment=github-pages&per_page=1');
    const d = await r.json(); const sha = Array.isArray(d) && d[0] ? d[0].sha.slice(0, 7) : '';
    el.textContent = sha;
    try { sessionStorage.setItem(KEY, JSON.stringify({ sha, t: Date.now() })); } catch {}
  } catch {}
})();
</script>
<script>setTimeout(() => { if (!window.ORB) document.querySelectorAll('.a-wait').forEach(el => el.classList.add('is-in')); }, 4000);   // страховка: шар не загрузился — показываем интерфейс без него</script>
<script src="core.js"></script>
<script>
const $ = s => document.querySelector(s);
const STEPS = [
  ['likes','Читаю твои лайки',          'лайки'],
  ['db',   'Сверяюсь с общей базой',    'база'],
  ['norm', 'Навожу порядок в названиях','имена'],
  ['feat', 'Меряю BPM и тональность',   'bpm · key'],
  ['save', 'Сохраняю',                  'сохранение'],
];
const ST = {}; STEPS.forEach(([k,l])=>ST[k]={label:l,status:'wait',done:0,total:0,note:''});
$('#steps').innerHTML = STEPS.map(([k,,chip])=>`<span class="chip chip--sm wait" id="s-${k}">${chip}</span>`).join('');
let CUR = null;
function onStep(k, p){
  Object.assign(ST[k], p);
  if(p.status==='run') CUR = k;
  const s = ST[CUR||k];
  $('#pLabel').textContent = s.label;
  $('#pCnt').textContent = s.total ? `${s.done.toLocaleString()} / ${s.total.toLocaleString()}` : '';
  $('#pBar').style.width = s.total ? `${Math.round(100*Math.min(s.done,s.total)/s.total)}%` : '0%';
  $('#pNote').textContent = s.note || '';
  STEPS.forEach(([key])=>{ $('#s-'+key).className = 'chip chip--sm ' + ST[key].status; });
}

// заголовок и кнопка уходят (.a-out), на их месте появляются лоадеры (.a-in) — шапка и шар не трогаются
function swapHeroToProgress(){
  const h = $('#hero'), pr = $('#prog');
  const show = () => { h.hidden = true; h.classList.remove('a-out'); pr.hidden = false; pr.classList.remove('a-in'); void pr.offsetWidth; pr.classList.add('a-in'); };
  if(h.hidden) return show();
  if(!$('#feed').classList.contains('is-in')) return show();   // вход ещё до появления кнопки — без анимации ухода
  h.classList.add('a-out');
  h.addEventListener('animationend', show, { once: true });
  setTimeout(() => { if(!h.hidden) show(); }, 900);   // страховка, если animationend не пришёл
}
function setLoading(on){ window.ORB?.setActive(on); $('#pEq').classList.toggle('is-paused', !on); }

let started = false;
async function start(){
  if(started) return; started = true;
  swapHeroToProgress(); $('#logout').hidden = false;
  setLoading(true);
  try{
    const tracks = await DJ.run(onStep);
    $('#pLabel').textContent = 'Готово'; $('#pCnt').textContent = `${tracks.length.toLocaleString()} треков`; $('#pBar').style.width='100%';
    setLoading(false);
    await new Promise(r=>setTimeout(r,500));
    showLibrary(tracks);
  }catch(e){
    setLoading(false);
    $('#pLabel').textContent = 'Что-то пошло не так';
    $('#pNote').textContent = e.message;
    const b = document.createElement('button'); b.className='btn btn--secondary btn--sm'; b.style.cssText='display:flex;margin:16px auto 0'; b.textContent='Ещё раз';
    b.onclick = ()=>{ b.remove(); started = false; start(); };
    $('#prog').appendChild(b);
    if(!DJ.loggedIn()){ started = false; $('#prog').hidden=true; $('#hero').hidden=false; showErr(e.message); }
  }
}

/* ---------- таблица ---------- */
let LIB = [], VIEW = [], SORT = {k:'added', asc:false}, LIMIT = 200;
const val = {
  n: t=>t._n, name: t=>t.name.toLowerCase(), artist: t=>t.artists[0].toLowerCase(),
  bpm: t=>t.bpm??-1, key: t=>{ const c=DJ.camelot(t.key,t.mode); return c ? c.n*2+(c.l==='B'?1:0) : 99; },
  energy: t=>t.energyAudio??-1, added: t=>t.added||'',
};
// куда уменьшается шар: центр на 92px от верха, диаметр ~120px.
// Сфера r=12 на дистанции 30 при fov 60 занимает ≈69% высоты канваса.
function orbTarget(){
  document.getElementById('orb').style.setProperty('--orb-s', (112 / (0.69 * innerHeight)).toFixed(4));
}
addEventListener('resize', orbTarget);
function showLibrary(tracks){
  LIB = tracks.map((t,i)=>({...t,_n:i+1}));
  orbTarget();
  // 1) лоадер уходит (.a-out) → 2) шар уезжает в лого → 3) таблица въезжает снизу под шаром (.a-rise)
  const pr = $('#prog'), lib = $('#lib');
  let went = false;
  const next = () => {
    if(went) return; went = true;
    pr.hidden = true; pr.classList.remove('a-out', 'a-in');
    document.body.classList.add('logo');
    setTimeout(() => { lib.hidden = false; lib.classList.add('a-rise'); }, 500);
  };
  if(pr.hidden) next(); else { pr.classList.add('a-out'); pr.addEventListener('animationend', next, { once: true }); setTimeout(next, 900); }
  $('#libStat').textContent = `${LIB.length.toLocaleString()} треков · BPM у ${LIB.filter(t=>t.bpm).length.toLocaleString()}`;
  render();
}
function render(){
  const q = $('#q').value.trim().toLowerCase();
  const f = t => !q || `${t.name} ${t.artists.join(' ')} ${t.bpm??''} ${DJ.camStr(DJ.camelot(t.key,t.mode))} ${DJ.keyName(t)}`.toLowerCase().includes(q);
  const v = val[SORT.k];
  VIEW = LIB.filter(f).sort((a,b)=>{ const x=v(a), y=v(b); return (x<y?-1:x>y?1:0) * (SORT.asc?1:-1); });
  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  $('#rows').innerHTML = VIEW.slice(0,LIMIT).map(t=>{
    const c = DJ.camelot(t.key,t.mode), e = t.energyAudio;
    return `<tr>
      <td class="c-n hide-s">${t._n}</td>
      <td class="c-title"><b title="${esc(t.name)}">${esc(t.name)}</b><span title="${esc(t.artists.join(', '))}">${esc(t.artists.join(', '))}</span></td>
      <td>${t.bpm!=null?`<span style="color:var(--fg)">${t.bpm}</span>`:'<span class="dash">—</span>'}</td>
      <td>${c?`<span class="key"><b>${DJ.camStr(c)}</b><span>${DJ.keyName(t)}</span></span>`:'<span class="dash">—</span>'}</td>
      <td class="hide-s">${e!=null?`<span class="meter${e>=.7?' is-hi':''}"><i style="width:${Math.round(e*100)}%"></i></span>`:'<span class="dash">—</span>'}</td>
      <td class="hide-s">${(t.added||'').slice(0,10)}</td>
    </tr>`;
  }).join('');
  $('#more').hidden = VIEW.length <= LIMIT;
  document.querySelectorAll('th').forEach(th=>{ th.classList.toggle('is-sorted', th.dataset.k===SORT.k); th.classList.toggle('is-asc', th.dataset.k===SORT.k && SORT.asc); });
  document.querySelectorAll('#sorts .chip').forEach(ch=>ch.classList.toggle('is-active', ch.dataset.k===SORT.k));
}
const setSort = k => { SORT = SORT.k===k ? {k, asc:!SORT.asc} : {k, asc: ['name','artist','n'].includes(k)}; LIMIT=200; render(); };
document.querySelectorAll('th').forEach(th=>th.onclick=()=>setSort(th.dataset.k));
$('#sorts').innerHTML = [['added','Недавние'],['bpm','BPM'],['key','Тональность'],['energy','Энергия'],['artist','Артист']]
  .map(([k,l])=>`<button class="chip" data-k="${k}">${l}</button>`).join('');
document.querySelectorAll('#sorts .chip').forEach(ch=>ch.onclick=()=>setSort(ch.dataset.k));
$('#q').addEventListener('input', ()=>{ LIMIT=200; render(); });
$('#more').onclick = ()=>{ LIMIT += 300; render(); };

/* ---------- старт ---------- */
function showErr(m){ const el=$('#heroErr'); el.textContent=m; el.hidden=!m; }
$('#feed').onclick = async () => {
  showErr('');
  try{ if(await DJ.login(null, { popup: true })) start(); }   // попап: без перезагрузки страницы
  catch(e){ showErr(e.message); }
};
$('#logout').onclick = () => { DJ.logout(); location.reload(); };
addEventListener('scroll', ()=>$('#top').classList.toggle('is-solid', scrollY > 140), {passive:true});
(async()=>{
  try{
    if(await DJ.handleCallback() === 'popup'){   // это окно-попап авторизации: токен отдан главной, окно закрывается
      setTimeout(() => showErr('Готово — это окно можно закрыть'), 400);   // если браузер не дал закрыть окно скриптом
      return;
    }
    if(DJ.loggedIn()) start();          // уже авторизован → сразу грузим (из кэша это секунды)
  }catch(e){ showErr(e.message); }
})();
</script>
<script type="module">
  import { mountLoader } from './loader.js';
  // загрузка страницы: яркая точка → из неё строится сетка → шум → мысли; лого + заголовок на 2.8 с → кнопка
  // (прежний вариант «рост из точки» — intro:2 и reveal на 1.8 с, тег intro-grow-v1)
  const stage = (sel) => document.querySelectorAll(sel).forEach(el => el.classList.add('is-in'));
  const reveal = () => { stage('#top, #heroTitle'); setTimeout(() => stage('#feed'), 450); };
  if (!window.DJ?.isAuthPopup?.()) try { window.ORB = mountLoader(document.getElementById('orb'), { intro:'build', gui:false, follow:true, axes:false, thought:true, params:{ shape:'Sphere', backgroundColor:'#121212', lineColor:'#535353', dotColor:'#1ed760', dotLength:0.2, thoughtColor:'#4cb3ff', centerBias:0.3, segments:9000 } }); } catch(e){ console.warn('orb', e); }
  setTimeout(reveal, 3000);   // заголовок и лого — когда сетка построена и рождается шум
</script>
</body>
</html>
