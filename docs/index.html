<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DJ Sorter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
  :root{
    --bg:#141414; --panel:#1b1b1b; --line:#2a2a2a; --wire:#5c5c5c;
    --fg:#e9e9e9; --mut:#8a8a8a; --sig:#33fff1; --sig-dim:rgba(51,255,241,.14); --err:#ff6b6b;
    color-scheme: dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 "JetBrains Mono",ui-monospace,Menlo,monospace}
  a{color:var(--mut)} a:hover{color:var(--sig)}

  /* --- сфера: сначала на весь экран, потом уезжает вверх логотипом --- */
  #orb{position:fixed;left:50%;top:50%;width:100vw;height:100vh;transform:translate(-50%,-50%);z-index:0;
       transition:width 1.2s cubic-bezier(.7,0,.2,1),height 1.2s cubic-bezier(.7,0,.2,1),top 1.2s cubic-bezier(.7,0,.2,1)}
  #orb canvas{display:block;width:100%;height:100%}
  body.logo #orb{top:calc(92px + env(safe-area-inset-top,0px));width:168px;height:168px}
  body.logo{overflow:auto}

  /* --- шапка --- */
  .top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;z-index:3;font-size:12px;letter-spacing:.06em}
  .word{font-family:Unbounded,system-ui,sans-serif;font-weight:700;letter-spacing:.02em;color:var(--fg)}
  .word b{color:var(--sig)}
  .top nav{display:flex;gap:16px}

  /* --- стартовый экран --- */
  #hero{position:fixed;inset:auto 0 calc(12vh + env(safe-area-inset-bottom,0px)) 0;display:flex;flex-direction:column;align-items:center;gap:14px;z-index:2;transition:opacity .5s}
  #feed{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:clamp(22px,4vw,34px);letter-spacing:.02em;
        color:var(--bg);background:var(--sig);border:0;border-radius:999px;padding:18px 44px;cursor:pointer;
        box-shadow:0 0 0 0 var(--sig-dim),0 0 40px rgba(51,255,241,.35);transition:transform .15s,box-shadow .3s}
  #feed:hover{transform:scale(1.04);box-shadow:0 0 0 10px var(--sig-dim),0 0 60px rgba(51,255,241,.5)}
  #feed:focus-visible{outline:2px solid var(--fg);outline-offset:4px}
  .hint{color:var(--mut);font-size:12px;text-align:center;max-width:34ch}

  /* --- прогресс внизу --- */
  #prog{position:fixed;left:50%;bottom:calc(9vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(520px,calc(100vw - 32px));z-index:2;transition:opacity .5s}
  #prog .now{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:13px}
  #prog .now b{font-weight:600}
  #prog .cnt{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--sig);box-shadow:0 0 10px var(--sig);transition:width .3s}
  #steps{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  #steps span{font-size:11px;color:var(--mut);padding:3px 8px;border:1px solid var(--line);border-radius:999px}
  #steps span.run{color:var(--sig);border-color:var(--sig)}
  #steps span.done{color:var(--fg);border-color:var(--wire)}
  #steps span.err{color:var(--err);border-color:var(--err)}
  #steps span.skip{color:var(--wire)}
  #prog .note{color:var(--mut);font-size:11px;margin-top:8px;min-height:1.2em;text-align:center}
  #prog .again{display:block;margin:10px auto 0;background:none;border:1px solid var(--sig);color:var(--sig);border-radius:999px;padding:6px 16px;font:inherit;cursor:pointer}

  /* --- библиотека --- */
  #lib{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:calc(200px + env(safe-area-inset-top,0px)) 16px 60px;opacity:0;transition:opacity .8s .4s}
  body.logo #lib{opacity:1}
  .libhead{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .libhead h2{font-family:Unbounded,system-ui,sans-serif;font-weight:500;font-size:20px;margin:0}
  .libhead h2 small{color:var(--mut);font-family:"JetBrains Mono",monospace;font-size:12px;margin-left:8px;font-weight:400}
  #q{background:var(--panel);border:1px solid var(--line);color:var(--fg);font:inherit;border-radius:8px;padding:8px 12px;min-width:0;width:min(320px,100%)}
  #q:focus{outline:none;border-color:var(--sig)}
  .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:rgba(27,27,27,.85);backdrop-filter:blur(6px)}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  th,td{padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
  th{position:sticky;top:0;background:var(--panel);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);cursor:pointer;user-select:none}
  th:hover{color:var(--fg)} th.on{color:var(--sig)} th.on::after{content:' ↓'} th.on.asc::after{content:' ↑'}
  td.t{max-width:340px;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
  td.a{max-width:220px;overflow:hidden;text-overflow:ellipsis;color:#bdbdbd}
  td.n,td.m{color:var(--mut)}
  .cam{display:inline-block;min-width:3.2em;color:var(--sig)}
  .en{display:inline-block;width:56px;height:4px;background:var(--line);border-radius:2px;vertical-align:middle;overflow:hidden}
  .en i{display:block;height:100%;background:var(--sig)}
  tr:hover td{background:rgba(51,255,241,.04)}
  .more{display:block;margin:14px auto 0;background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:6px 16px;font:inherit;cursor:pointer}
  .more:hover{border-color:var(--sig);color:var(--sig)}
  @media (max-width:640px){ .hide-s{display:none} td.t{max-width:180px} td.a{max-width:120px} }
  @media (prefers-reduced-motion: reduce){ #orb,#lib,#hero,#prog{transition:none} }
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div id="orb" aria-hidden="true"></div>

  <header class="top">
    <span class="word">dj<b>/</b>sorter</span>
    <nav><a href="nerd_mode.html">nerd_mode</a><a href="#" id="logout" hidden>выйти</a></nav>
  </header>

  <section id="hero">
    <button id="feed" type="button">Feed me</button>
    <div class="hint">Подключи Spotify — разберу твои лайки по BPM и тональности</div>
  </section>

  <section id="prog" hidden aria-live="polite">
    <div class="now"><b id="pLabel">…</b><span class="cnt" id="pCnt"></span></div>
    <div class="bar"><i id="pBar"></i></div>
    <div id="steps"></div>
    <div class="note" id="pNote"></div>
  </section>

  <main id="lib" hidden>
    <div class="libhead">
      <h2>Твоя библиотека <small id="libStat"></small></h2>
      <input id="q" type="search" placeholder="поиск: трек, артист, 124, 8A…" autocomplete="off">
    </div>
    <div class="tbl"><table>
      <thead><tr>
        <th data-k="n" class="hide-s">#</th>
        <th data-k="name">Трек</th>
        <th data-k="artist">Артист</th>
        <th data-k="bpm">BPM</th>
        <th data-k="key">Key</th>
        <th data-k="energy" class="hide-s">Energy</th>
        <th data-k="added" class="hide-s">Лайк</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <button class="more" id="more" hidden>показать ещё</button>
  </main>

<script src="core.js"></script>
<script>
const $ = s => document.querySelector(s);
const STEPS = [
  ['likes','Читаю твои лайки',          'лайки'],
  ['db',   'Сверяюсь с общей базой',    'база'],
  ['norm', 'Навожу порядок в названиях','имена'],
  ['feat', 'Меряю BPM и тональность',   'bpm · key'],
  ['save', 'Сохраняю',                  'сохранение'],
];
const ST = {}; STEPS.forEach(([k,l])=>ST[k]={label:l,status:'wait',done:0,total:0,note:''});
$('#steps').innerHTML = STEPS.map(([k,,chip])=>`<span id="s-${k}">${chip}</span>`).join('');
let CUR = null;
function onStep(k, p){
  Object.assign(ST[k], p);
  if(p.status==='run') CUR = k;
  const s = ST[CUR||k];
  $('#pLabel').textContent = s.label;
  $('#pCnt').textContent = s.total ? `${s.done.toLocaleString()} / ${s.total.toLocaleString()}` : '';
  $('#pBar').style.width = s.total ? `${Math.round(100*Math.min(s.done,s.total)/s.total)}%` : '0%';
  $('#pNote').textContent = s.note || '';
  STEPS.forEach(([key])=>{ $('#s-'+key).className = ST[key].status; });
}

function setLoading(on){ window.ORB?.setActive(on); }

async function start(){
  $('#hero').hidden = true; $('#prog').hidden = false; $('#logout').hidden = false;
  setLoading(true);
  try{
    const tracks = await DJ.run(onStep);
    $('#pLabel').textContent = 'Готово'; $('#pCnt').textContent = `${tracks.length.toLocaleString()} треков`; $('#pBar').style.width='100%';
    setLoading(false);
    await new Promise(r=>setTimeout(r,700));
    showLibrary(tracks);
  }catch(e){
    setLoading(false);
    $('#pLabel').textContent = 'Что-то пошло не так';
    $('#pNote').textContent = e.message;
    const b = document.createElement('button'); b.className='again'; b.textContent='ещё раз';
    b.onclick = ()=>{ b.remove(); start(); };
    $('#prog').appendChild(b);
    if(!DJ.loggedIn()){ $('#prog').hidden=true; $('#hero').hidden=false; }
  }
}

/* ---------- таблица ---------- */
let LIB = [], VIEW = [], SORT = {k:'added', asc:false}, LIMIT = 200;
const val = {
  n: t=>t._n, name: t=>t.name.toLowerCase(), artist: t=>t.artists[0].toLowerCase(),
  bpm: t=>t.bpm??-1, key: t=>{ const c=DJ.camelot(t.key,t.mode); return c ? c.n*2+(c.l==='B'?1:0) : 99; },
  energy: t=>t.energyAudio??-1, added: t=>t.added||'',
};
function showLibrary(tracks){
  LIB = tracks.map((t,i)=>({...t,_n:i+1}));
  document.body.classList.add('logo');
  $('#prog').hidden = true; $('#lib').hidden = false;
  $('#libStat').textContent = `${LIB.length.toLocaleString()} треков · BPM у ${LIB.filter(t=>t.bpm).length.toLocaleString()}`;
  render();
}
function render(){
  const q = $('#q').value.trim().toLowerCase();
  const f = t => !q || `${t.name} ${t.artists.join(' ')} ${t.bpm??''} ${DJ.camStr(DJ.camelot(t.key,t.mode))} ${DJ.keyName(t)}`.toLowerCase().includes(q);
  const v = val[SORT.k];
  VIEW = LIB.filter(f).sort((a,b)=>{ const x=v(a), y=v(b); return (x<y?-1:x>y?1:0) * (SORT.asc?1:-1); });
  const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  $('#rows').innerHTML = VIEW.slice(0,LIMIT).map(t=>{
    const c = DJ.camelot(t.key,t.mode), e = t.energyAudio;
    return `<tr>
      <td class="n hide-s">${t._n}</td>
      <td class="t" title="${esc(t.name)}">${esc(t.name)}</td>
      <td class="a" title="${esc(t.artists.join(', '))}">${esc(t.artists.join(', '))}</td>
      <td>${t.bpm??'<span class="m">—</span>'}</td>
      <td>${c?`<span class="cam">${DJ.camStr(c)}</span> <span class="m">${DJ.keyName(t)}</span>`:'<span class="m">—</span>'}</td>
      <td class="hide-s">${e!=null?`<span class="en"><i style="width:${Math.round(e*100)}%"></i></span>`:'<span class="m">—</span>'}</td>
      <td class="m hide-s">${(t.added||'').slice(0,10)}</td>
    </tr>`;
  }).join('');
  $('#more').hidden = VIEW.length <= LIMIT;
  document.querySelectorAll('th').forEach(th=>{ th.classList.toggle('on', th.dataset.k===SORT.k); th.classList.toggle('asc', th.dataset.k===SORT.k && SORT.asc); });
}
document.querySelectorAll('th').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k; SORT = SORT.k===k ? {k, asc:!SORT.asc} : {k, asc: ['name','artist','n'].includes(k)}; LIMIT=200; render();
});
$('#q').addEventListener('input', ()=>{ LIMIT=200; render(); });
$('#more').onclick = ()=>{ LIMIT += 300; render(); };

/* ---------- старт ---------- */
$('#feed').onclick = () => DJ.login();
$('#logout').onclick = e => { e.preventDefault(); DJ.logout(); location.reload(); };
(async()=>{
  try{
    await DJ.handleCallback();          // вернулись из Spotify (или ушли на returnTo)
    if(DJ.loggedIn()) start();          // уже авторизован → сразу грузим (из кэша это секунды)
  }catch(e){ $('.hint').textContent = e.message; }
})();
</script>
<script type="module">
  import { mountLoader } from './loader.js';
  try { window.ORB = mountLoader(document.getElementById('orb'), { gui:false }); } catch(e){ console.warn('orb', e); }
</script>
</body>
</html>
